name: Test, build and tag

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/unit-tests.yml

  build:
    needs: tests
    uses: ./.github/workflows/build.yml

  tag:
    needs: [tests, build]
    permissions:
      contents: write
    uses: ./.github/workflows/tag.yml